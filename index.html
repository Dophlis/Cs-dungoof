<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live Counter</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    #count { font-size: 80px; font-weight: bold; margin: 20px 0; }
    button { font-size: 24px; padding: 15px 30px; cursor: pointer; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Dungoof Counter</h1>
  <div id="count">Loading...</div>
  <button onclick="increment()">Add a dungoof</button>

  <script>
    const SCRIPT_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQYHundetX7WeRpRnyKa9BQoT067xxNjrH9K1Jwg_S9OsDZFByIFb6R2TAjpoQCQs_LGQOq0hkERpVPrbhFDJMlN4DTQwa-eZrcO-IDuXgB5CoQ5qZ1MpzEqaPZUIQom-oMecm8xZ4M2CmLQFdyiEKcceJRW429T7ICOzfNoXWFEnj_pNBnV3rg3v9DRuYzfvfaGPkUJS5YFEB9hJmhAe4c7AFg6poh-HvuhktL0po4nipsPtUG-UnTmNEsWBveiJkf2Ik3iTxkGcb0HkQ&lib=MWR9Or_0Unezr9uX2i6E6_bYs4wonrQEQ";

    async function getCount() {
      const res = await fetch(SCRIPT_URL);
      const data = await res.text();
      document.getElementById("count").innerText = data;
    }

    async function increment() {
      await fetch(SCRIPT_URL, { method: "POST" });
      getCount();
    }

    setInterval(getCount, 3000);
    getCount();
  </script>
</body>
</html>
