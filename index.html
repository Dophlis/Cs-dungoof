<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live Counter</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    #count { font-size: 80px; font-weight: bold; margin: 20px 0; }
    button { font-size: 24px; padding: 15px 30px; cursor: pointer; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Donegoof Counter</h1>
  <div id="count">Loading...</div>
  <button onclick="increment()">Add a donegoof</button>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBXNNd-PkzfgbVsK2bO9V6A8Z7W9FUOSAn_7n6KAluhhldZYkcg3H55KtXFi3CilU/exec";

  async function getCount() {
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.text();
      if (data) {
        document.getElementById("count").innerText = data;
      }
    } catch (err) {
      console.error("Error fetching count:", err);
    }
  }

  async function increment() {
    // Optimistic UI update: increase number immediately on screen
    const countDiv = document.getElementById("count");
    const currentNum = parseInt(countDiv.innerText) || 0;
    countDiv.innerText = currentNum + 1;

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors"
      });
      setTimeout(getCount, 1500);
    } catch (err) {
      console.error("Error updating count:", err);
    }
  }

  setInterval(getCount, 5000);
  getCount();
</script>

</body>
</html>
